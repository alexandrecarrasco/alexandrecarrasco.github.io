<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
{{- partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{ partial "header.html" . }}
{{- block "progress" . }}{{ end }}
<main id="main">
{{- block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{- $js := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
