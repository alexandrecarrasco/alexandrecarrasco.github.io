<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 766" role="img" color="#1e293b" aria-label="The whole flow, with signals. Before any request: 0, the agent is on record in the agent registry, with an owner and the status active. At 10:00, getting a token: 1, Alice asks the agent to pay an invoice; 2, the agent asks the authorization server for a token; 3, the authorization server checks its own record of the agent: known and enabled; 4, it returns an access token whose audience is the MCP server. At 10:01, something changes: A, Alice&#x27;s account is disabled at the authorization server, which is the SSF Transmitter; B, the authorization server sends an account-disabled event to the signal receiver, the SSF Receiver; C, the signal receiver records for the PDP that Alice&#x27;s account is disabled. At 10:02, the next call: 5, the agent sends tools/call transfer_funds with the still-valid token to the gateway, the PEP; 6, the gateway asks the PDP to evaluate the call; 7, the PDP answers decision false; the gateway returns an error to the agent. Steps 8 to 11 never happen: the MCP server is not reached.">
  <defs>
    <marker id="p2s-m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="dg-line-fill" d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="p2s-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="dg-l1-fill" d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker>
  </defs>
  <rect class="dg-card" x="1" y="1" width="758" height="764" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="currentColor">
    <text x="24" y="32" font-size="15" font-weight="600">The whole flow, with signals</text>
    <!-- phases -->
    <rect class="dg-note" x="16" y="118" width="728" height="86" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="135" font-size="11.5" font-weight="600" fill="#64748b">Before any request</text>
    <rect class="dg-note" x="16" y="210" width="728" height="176" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="227" font-size="11.5" font-weight="600" fill="#64748b">10:00 · Getting a token</text>
    <rect class="dg-note" x="16" y="392" width="728" height="146" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="409" font-size="11.5" font-weight="600" fill="#64748b">10:01 · Something changes</text>
    <rect class="dg-note" x="16" y="544" width="728" height="206" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="561" font-size="11.5" font-weight="600" fill="#64748b">10:02 · The next call</text>
    <!-- lifelines -->
    <g class="dg-rule" stroke="#e2e8f0" stroke-width="1.25" stroke-dasharray="4 4">
      <line x1="65" x2="65" y1="108" y2="750"/>
      <line x1="155" x2="155" y1="108" y2="750"/>
      <line x1="245" x2="245" y1="108" y2="750"/>
      <line x1="335" x2="335" y1="108" y2="750"/>
      <line x1="425" x2="425" y1="108" y2="750"/>
      <line x1="515" x2="515" y1="108" y2="750"/>
      <line x1="605" x2="605" y1="108" y2="750"/>
      <line x1="695" x2="695" y1="108" y2="750"/>
    </g>
    <!-- steps done by one party on its own -->
    <rect class="dg-card" x="286.65" y="148" width="96.7" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="335" y="167" text-anchor="middle" font-size="11.5">0 on record:</text>
    <text x="335" y="182" text-anchor="middle" font-size="11.5">owner, active</text>
    <rect class="dg-card" x="190.75" y="300" width="108.5" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="245" y="319" text-anchor="middle" font-size="11.5">3 checks: agent</text>
    <text x="245" y="334" text-anchor="middle" font-size="11.5">known, enabled</text>
    <rect class="dg-focus" x="184.85" y="422" width="120.3" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="245" y="441" text-anchor="middle" font-size="11.5">A Alice&#x27;s account</text>
    <text x="245" y="456" text-anchor="middle" font-size="11.5">is disabled</text>
    <rect class="dg-card" x="641.3" y="694" width="96.7" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="689.65" y="713" text-anchor="middle" font-size="11.5">8 to 11 never</text>
    <text x="689.65" y="728" text-anchor="middle" font-size="11.5">happen</text>
    <!-- parties -->
    <g font-weight="600" font-size="12" text-anchor="middle">
      <rect class="dg-box" x="22" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="65" y="83.5">User</text>
      <rect class="dg-box" x="112" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="155" y="76">Agent</text>
      <text class="dg-muted" x="155" y="91" font-weight="400" font-size="10.5" fill="#64748b">MCP client</text>
      <rect class="dg-box" x="202" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="245" y="68.5">Authorization</text>
      <text x="245" y="83.5">server</text>
      <text class="dg-muted" x="245" y="98.5" font-weight="400" font-size="10.5" fill="#64748b">SSF Transmitter</text>
      <rect class="dg-box" x="292" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="335" y="76">Agent</text>
      <text x="335" y="91">registry</text>
      <rect class="dg-focus" x="382" y="50" width="86" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
      <text x="425" y="68.5">Signal</text>
      <text x="425" y="83.5">receiver</text>
      <text class="dg-muted" x="425" y="98.5" font-weight="400" font-size="10.5" fill="#64748b">SSF Receiver</text>
      <rect class="dg-box" x="472" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="515" y="76">Gateway</text>
      <text class="dg-muted" x="515" y="91" font-weight="400" font-size="10.5" fill="#64748b">PEP</text>
      <rect class="dg-box" x="562" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="605" y="83.5">PDP</text>
      <rect class="dg-box" x="652" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="695" y="83.5">MCP server</text>
    </g>
    <!-- the flow from the first post -->
    <g class="dg-line" fill="none" stroke="#64748b" stroke-width="1.25" marker-end="url(#p2s-m0)">
      <path d="M65 250H155"/>
      <path d="M155 280H245"/>
      <path d="M245 366H155"/>
      <path d="M155 584H515"/>
      <path d="M515 614H605"/>
      <path d="M605 644H515"/>
      <path d="M515 674H155"/>
    </g>
    <!-- what this post adds -->
    <g class="dg-l1" fill="none" stroke="#1d4ed8" stroke-width="1.75" marker-end="url(#p2s-m1)">
      <path d="M245 488H425"/>
      <path d="M425 518H605"/>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="110" y="244">1 pay invoice</text>
      <text x="200" y="274">2 token request</text>
      <text x="200" y="360">4 token, audience = MCP server</text>
      <text x="335" y="482">B account-disabled</text>
      <text x="515" y="512">C Alice: disabled</text>
      <text x="335" y="578">5 tools/call transfer_funds + token</text>
      <text x="560" y="608">6 evaluate</text>
      <text x="560" y="638">7 decision: false</text>
      <text x="335" y="668">error: the call is refused</text>
    </g>
  </g>
</svg>
