<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 722" role="img" color="#1e293b" aria-label="The whole flow, with signals. Before any request: 0, the agent is on record in the agent registry, with an owner and the status active. At 10:00, getting a token: 1, Alice asks the agent to pay an invoice; 2, the agent asks the authorization server for a token; 3, the authorization server checks its own record of the agent: known and enabled; 4, it returns an access token whose audience is the MCP server. At 10:01, something changes: A, Alice&#x27;s account is disabled at the authorization server, which is the SSF Transmitter; B, the authorization server sends an account-disabled event to the signal receiver, the SSF Receiver; C, the signal receiver records for the PDP that Alice&#x27;s account is disabled. At 10:02, the next call: 5, the agent sends tools/call transfer_funds with the still-valid token to the gateway, the PEP; 6, the gateway asks the PDP to evaluate the call; 7, the PDP answers decision false; the gateway returns an error to the agent. Steps 8 to 11 never happen: the MCP server is not reached.">
  <rect class="dg-card" x="1" y="1" width="358" height="720" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="currentColor">
    <text x="16" y="30" font-size="14" font-weight="600">The whole flow, with signals</text>
    <!-- phases -->
    <rect class="dg-note" x="10" y="44" width="340" height="68" rx="8" fill="#f1f5f9" stroke="none"/>
    <rect class="dg-note" x="10" y="118" width="340" height="194" rx="8" fill="#f1f5f9" stroke="none"/>
    <rect class="dg-note" x="10" y="318" width="340" height="152" rx="8" fill="#f1f5f9" stroke="none"/>
    <rect class="dg-note" x="10" y="476" width="340" height="236" rx="8" fill="#f1f5f9" stroke="none"/>
    <g class="dg-muted" font-size="11" font-weight="600" fill="#64748b">
      <text x="20" y="62">Before any request</text>
      <text x="20" y="136">10:00 · Getting a token</text>
      <text x="20" y="336">10:01 · Something changes</text>
      <text x="20" y="494">10:02 · The next call</text>
    </g>
    <!-- step markers: blue for what this post adds -->
    <g text-anchor="middle" font-size="11.5" font-weight="600">
      <circle class="dg-num" cx="34" cy="88" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="92">0</text>
      <circle class="dg-num" cx="34" cy="162" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="166">1</text>
      <circle class="dg-num" cx="34" cy="204" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="208">2</text>
      <circle class="dg-num" cx="34" cy="246" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="250">3</text>
      <circle class="dg-num" cx="34" cy="288" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="292">4</text>
      <circle class="dg-focus" cx="34" cy="362" r="12" fill="#eff6ff" stroke="#1d4ed8"/><text x="34" y="366">A</text>
      <circle class="dg-focus" cx="34" cy="404" r="12" fill="#eff6ff" stroke="#1d4ed8"/><text x="34" y="408">B</text>
      <circle class="dg-focus" cx="34" cy="446" r="12" fill="#eff6ff" stroke="#1d4ed8"/><text x="34" y="450">C</text>
      <circle class="dg-num" cx="34" cy="520" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="524">5</text>
      <circle class="dg-num" cx="34" cy="562" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="566">6</text>
      <circle class="dg-num" cx="34" cy="604" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="608">7</text>
      <circle class="dg-num" cx="34" cy="646" r="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="650">!</text>
      <rect class="dg-num" x="18" y="676" width="32" height="24" rx="12" fill="#ffffff" stroke="#64748b"/><text x="34" y="691.5" font-size="10">8–11</text>
    </g>
    <!-- steps: who, then what -->
    <g>
      <text x="56" y="84" font-weight="600">Agent registry</text>
      <text class="dg-muted" x="56" y="100" font-size="11.5" fill="#64748b">agent on record: owner, active</text>
      <text x="56" y="158" font-weight="600">User → Agent</text>
      <text class="dg-muted" x="56" y="174" font-size="11.5" fill="#64748b">pay invoice 4471</text>
      <text x="56" y="200" font-weight="600">Agent → Authorization server</text>
      <text class="dg-muted" x="56" y="216" font-size="11.5" fill="#64748b">token request, resource = MCP server</text>
      <text x="56" y="242" font-weight="600">Authorization server</text>
      <text class="dg-muted" x="56" y="258" font-size="11.5" fill="#64748b">checks its record: agent known, enabled</text>
      <text x="56" y="284" font-weight="600">Authorization server → Agent</text>
      <text class="dg-muted" x="56" y="300" font-size="11.5" fill="#64748b">token, audience = MCP server</text>
      <text x="56" y="358" font-weight="600">Authorization server (SSF Transmitter)</text>
      <text class="dg-muted" x="56" y="374" font-size="11.5" fill="#64748b">Alice&#x27;s account is disabled</text>
      <text x="56" y="400" font-weight="600">Authorization server → Signal receiver</text>
      <text class="dg-muted" x="56" y="416" font-size="11.5" fill="#64748b">event: account-disabled</text>
      <text x="56" y="442" font-weight="600">Signal receiver (SSF Receiver) → PDP</text>
      <text class="dg-muted" x="56" y="458" font-size="11.5" fill="#64748b">Alice: disabled</text>
      <text x="56" y="516" font-weight="600">Agent → Gateway (PEP)</text>
      <text class="dg-muted" x="56" y="532" font-size="11.5" fill="#64748b">tools/call transfer_funds + token</text>
      <text x="56" y="558" font-weight="600">Gateway → PDP</text>
      <text class="dg-muted" x="56" y="574" font-size="11.5" fill="#64748b">evaluate: Alice, agent, 800 EUR</text>
      <text x="56" y="600" font-weight="600">PDP → Gateway</text>
      <text class="dg-muted" x="56" y="616" font-size="11.5" fill="#64748b">decision: false</text>
      <text x="56" y="642" font-weight="600">Gateway → Agent</text>
      <text class="dg-muted" x="56" y="658" font-size="11.5" fill="#64748b">error: the call is refused</text>
      <text x="56" y="684" font-weight="600">MCP server</text>
      <text class="dg-muted" x="56" y="700" font-size="11.5" fill="#64748b">never reached: steps 8 to 11 do not happen</text>
    </g>
  </g>
</svg>
