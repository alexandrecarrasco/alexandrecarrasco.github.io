<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 938" role="img" color="#1e293b" aria-label="The whole flow, with tokens bound to a key. Before any request: 0, the agent is on record in the agent registry, with an owner and the status active, and the agent generates a key pair; the private key never leaves it. Getting a bound token: 1, Alice asks the agent to pay an invoice; 2, the agent asks the authorization server for a token and adds a DPoP proof signed with its private key, carrying its public key; 3, the authorization server checks its own record of the agent and binds the token to the agent&#x27;s key; 4, it returns the token, with the key&#x27;s thumbprint in the cnf claim. Every call: 5, the agent sends tools/call with the token and a fresh proof to the gateway, the PEP, which checks the proof: the key matches the token, and the method, URL, token hash, time and unique identifier are right; 6, the gateway asks the PDP to evaluate the call; 7, the PDP answers decision true; 8, the gateway forwards the call to the MCP server; 9, the MCP server checks the audience and runs the tool; 10, the result goes back to the agent through the gateway; 11, the agent tells Alice the invoice is paid. A stolen token: an attacker who copied the token sends it to the gateway without a valid proof from the agent&#x27;s key; the gateway refuses it with 401. The PDP is not asked and the MCP server is not reached.">
  <defs>
    <marker id="p4p-m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="dg-line-fill" d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="p4p-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="dg-l1-fill" d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker>
  </defs>
  <rect class="dg-card" x="1" y="1" width="758" height="936" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="currentColor">
    <text x="24" y="32" font-size="15" font-weight="600">The whole flow, with bound tokens</text>
    <!-- phases -->
    <rect class="dg-note" x="16" y="118" width="728" height="142" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="135" font-size="11.5" font-weight="600" fill="#64748b">Before any request</text>
    <rect class="dg-note" x="16" y="266" width="728" height="176" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="283" font-size="11.5" font-weight="600" fill="#64748b">Getting a bound token</text>
    <rect class="dg-note" x="16" y="448" width="728" height="322" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="465" font-size="11.5" font-weight="600" fill="#64748b">Every call</text>
    <rect class="dg-note" x="16" y="776" width="728" height="146" rx="8" fill="#f1f5f9" stroke="none"/>
    <text class="dg-muted" x="24" y="793" font-size="11.5" font-weight="600" fill="#64748b">A stolen token</text>
    <!-- lifelines -->
    <g class="dg-rule" stroke="#e2e8f0" stroke-width="1.25" stroke-dasharray="4 4">
      <line x1="65" x2="65" y1="108" y2="922"/>
      <line x1="155" x2="155" y1="108" y2="922"/>
      <line x1="245" x2="245" y1="108" y2="922"/>
      <line x1="335" x2="335" y1="108" y2="922"/>
      <line x1="425" x2="425" y1="108" y2="922"/>
      <line x1="515" x2="515" y1="108" y2="922"/>
      <line x1="605" x2="605" y1="108" y2="922"/>
      <line x1="695" x2="695" y1="108" y2="922"/>
    </g>
    <!-- steps done by one party on its own -->
    <rect class="dg-card" x="286.65" y="148" width="96.7" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="335" y="167" text-anchor="middle" font-size="11.5">0 on record:</text>
    <text x="335" y="182" text-anchor="middle" font-size="11.5">owner, active</text>
    <rect class="dg-focus" x="115.5" y="204" width="79" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="155" y="223" text-anchor="middle" font-size="11.5">generates</text>
    <text x="155" y="238" text-anchor="middle" font-size="11.5">a key pair</text>
    <rect class="dg-focus" x="161.25" y="356" width="167.5" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="245" y="375" text-anchor="middle" font-size="11.5">3 checks the agent, binds</text>
    <text x="245" y="390" text-anchor="middle" font-size="11.5">the token to its key</text>
    <rect class="dg-focus" x="326.5" y="508" width="197" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="425" y="527" text-anchor="middle" font-size="11.5">checks the proof: key, method,</text>
    <text x="425" y="542" text-anchor="middle" font-size="11.5">URL, token hash, time, jti</text>
    <rect class="dg-card" x="541.9" y="654" width="126.2" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="605" y="673" text-anchor="middle" font-size="11.5">9 checks audience,</text>
    <text x="605" y="688" text-anchor="middle" font-size="11.5">runs the tool</text>
    <rect class="dg-card" x="451.9" y="866" width="126.2" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="515" y="885" text-anchor="middle" font-size="11.5">PDP not asked, MCP</text>
    <text x="515" y="900" text-anchor="middle" font-size="11.5">server not reached</text>
    <!-- parties -->
    <g font-weight="600" font-size="12" text-anchor="middle">
      <rect class="dg-box" x="22" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="65" y="83.5">User</text>
      <rect class="dg-focus" x="112" y="50" width="86" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
      <text x="155" y="76">Agent</text>
      <text class="dg-muted" x="155" y="91" font-weight="400" font-size="10.5" fill="#64748b">holds the key</text>
      <rect class="dg-box" x="202" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="245" y="76">Authorization</text>
      <text x="245" y="91">server</text>
      <rect class="dg-box" x="292" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="335" y="76">Agent</text>
      <text x="335" y="91">registry</text>
      <rect class="dg-focus" x="382" y="50" width="86" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
      <text x="425" y="76">Gateway</text>
      <text class="dg-muted" x="425" y="91" font-weight="400" font-size="10.5" fill="#64748b">PEP</text>
      <rect class="dg-box" x="472" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="515" y="83.5">PDP</text>
      <rect class="dg-box" x="562" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="605" y="83.5">MCP server</text>
      <rect class="dg-box" x="652" y="50" width="86" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="695" y="76">Attacker</text>
      <text class="dg-muted" x="695" y="91" font-weight="400" font-size="10.5" fill="#64748b">token, no key</text>
    </g>
    <!-- the flow from the first post -->
    <g class="dg-line" fill="none" stroke="#64748b" stroke-width="1.25" marker-end="url(#p4p-m0)">
      <path d="M65 306H155"/>
      <path d="M425 574H515"/>
      <path d="M515 604H425"/>
      <path d="M425 634H605"/>
      <path d="M605 720H155"/>
      <path d="M155 750H65"/>
      <path d="M695 816H425"/>
    </g>
    <!-- what this post adds -->
    <g class="dg-l1" fill="none" stroke="#1d4ed8" stroke-width="1.75" marker-end="url(#p4p-m1)">
      <path d="M155 336H245"/>
      <path d="M245 422H155"/>
      <path d="M155 488H425"/>
      <path d="M425 846H695"/>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="110" y="300">1 pay invoice</text>
      <text x="200" y="330">2 token request + proof</text>
      <text x="200" y="416">4 token, bound to the key (cnf.jkt)</text>
      <text x="290" y="482">5 tools/call + token + fresh proof</text>
      <text x="470" y="568">6 evaluate</text>
      <text x="470" y="598">7 decision: true</text>
      <text x="515" y="628">8 call + token</text>
      <text x="380" y="714">10 result (back through the gateway)</text>
      <text x="110" y="744">11 paid</text>
      <text x="560" y="810">the copied token, with no valid proof</text>
      <text x="560" y="840">refused: 401</text>
    </g>
  </g>
</svg>
